<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CORNSIL</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #F1F5F9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #1E293B; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; color: #475569; font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563EB; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1D4ED8; }
    .flash { padding: 10px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; }
    .flash.danger { background: #FEE2E2; color: #991B1B; }
    .checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #475569; margin-bottom: 20px;}
  </style>
</head>
<body>

<div class="login-box">
  <h2>Admin Portal</h2>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <div class="checkbox">
      <input type="checkbox" name="remember" id="remember">
      <label for="remember" style="margin:0; font-weight:normal;">Remember Me</label>
    </div>
    <button type="submit">Login</button>
  </form>
</div>

</body>
</html>
